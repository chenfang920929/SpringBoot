<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <meta charset="UTF-8">
    <title>客户管理</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta http-equiv="Access-Control-Allow-Origin" content="*">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" href="../resources/favicon.ico">
    <link rel="stylesheet" href="../resources/layui/css/layui.css"  media="all"/>
    <link rel="stylesheet" href="../resources/css/public.css" media="all"/>
    <link rel="stylesheet" href="../resources/layui_ext/dtree/dtree.css" media="all"/>
    <link rel="stylesheet" href="../resources/layui_ext/dtree/font/dtreefont.css" media="all"/>
</head>
<body>
<!--查询条件-->
<fieldset class="layui-elem-field layui-field-title" style="margin-top: 15px;">
    <legend>搜索条件</legend>
</fieldset>
<form action="" method="post" id="searchFrm" lay-filter="searchFrm" class="layui-form">
    <div class="layui-form-item">
        <div class="layui-inline">
            <label class="layui-form-label">客户名称</label>
            <div class="layui-input-inline">
                <input type="text" name="customername" id="customername" class="layui-input input-radius"
                       placeholder="请输入客户名称">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">联系人名称</label>
            <div class="layui-input-inline">
                <input type="text" name="connectionpersion" id="connectionpersion" class="layui-input input-radius" placeholder="请输入联系人名称">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">联系人号码</label>
            <div class="layui-input-inline">
                <input type="text" name="phone" id="phone" class="layui-input input-radius" placeholder="请输入联系人号码">
            </div>
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-block" style="text-align: center;padding-right: 15%;">
            <button type="button" class="layui-btn layui-btn-sm layui-btn-radius" lay-submit="" lay-filter="doSearch"><i
                    class="layui-icon layui-icon-search layui-icon-normal"></i>查询
            </button>
            <button type="reset" class="layui-btn layui-btn-sm layui-btn-radius layui-btn-warm"><i
                    class="layui-icon layui-icon-refresh"></i><span>重置</span>
            </button>
        </div>
    </div>
</form>
<fieldset class="layui-elem-field layui-field-title" style="margin-top: 15px;">
    <legend>选择Excel File导入数据</legend>
</fieldset>
<div class="layui-card">
    <div class="layui-card-body">
		<form class="layui-form" lay-filter="import-form">
		    <div class="layui-form-item">
		        <label class="layui-form-label">选择文件</label>
		        <div class="layui-input-inline">
		            <button type="button" class="layui-btn" id="select-file">
		                <i class="layui-icon">&#xe67c;</i>选择Excel文件 
		            </button>
		            <input type="file" id="file-input" style="display:none" accept=".xlsx,.xls">
		        </div>
				<div class="layui-input-inline">
				     <span id="file-name" style="color:#666;"></span>
				</div>
				<div class="layui-input-inline">
				      <button type="button" class="layui-btn layui-btn-normal" id="import-btn">
				         <i class="layui-icon layui-icon-upload"></i>开始导入 
				      </button>
				 </div>
		        <div class="layui-input-inline">
		            <button type="button" class="layui-btn layui-btn-primary" id="download-template">
		                <i class="layui-icon">&#xe601;</i>下载模板 
		            </button>
		        </div>
		    </div>
		</form>
        
        <div id="progress-container" style="display: none; margin-top: 20px;">
            <div class="layui-progress" lay-showpercent="true" lay-filter="import-progress">
                <div class="layui-progress-bar" lay-percent="0%"></div>
            </div>
            <div id="import-result" style="margin-top: 10px;"></div>
        </div>
    </div>
</div>
<!--数据表格-->
<div>
    <table class="layui-hide" id="customerTable" lay-filter="customerTable"></table>
    <div id="customerToolBar" style="display: none">
        <button type="button" lay-event="add" shiro:hasPermission="customer:create" class="layui-btn layui-btn-sm layui-btn-normal layui-btn-radius">
            <i class="layui-icon layui-icon-add-1"></i>添加客户
        </button>
    </div>
    <div id="customerRowBar" style="display: none;">
        <button type="button" lay-event="update" shiro:hasPermission="customer:update" class="layui-btn layui-btn-sm layui-btn-radius"><i
                class="layui-icon layui-icon-edit"></i>编辑
        </button>
        <button type="button" lay-event="delete" shiro:hasPermission="customer:delete" class="layui-btn layui-btn-sm layui-btn-danger layui-btn-radius"><i
                class="layui-icon layui-icon-delete"></i>删除
        </button>
    </div>
</div>

<!--添加和修改弹出层-->
<div id="addOrUpdateDiv" style="display: none;padding: 10px;padding-right: 5%">
    <form action="" method="post" class="layui-form" id="dataFrm" lay-filter="dataFrm">
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">客户名称</label>
                <div class="layui-input-block">
                    <input type="hidden" name="id">
                    <input type="text" name="customername" lay-verify="required" autocomplete="off"
                           class="layui-input input-radius" placeholder="请输入客户名称">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">客户地址</label>
                <div class="layui-input-block">
                    <input type="text" name="address" lay-verify="required" autocomplete="off" class="layui-input input-radius" placeholder="请输入客户地址">
                </div>
            </div>

        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">联系人</label>
                <div class="layui-input-block">
                    <input type="text" name="connectionpersion" lay-verify="required" autocomplete="off" class="layui-input input-radius" placeholder="请输入联系人姓名">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">联系电话</label>
                <div class="layui-input-block">
                    <input type="text" name="phone" lay-verify="required|number" autocomplete="off" class="layui-input input-radius" placeholder="请输入联系人电话">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">邮箱</label>
                <div class="layui-input-block">
                    <input type="text" id="email" name="email" lay-verify="required" autocomplete="off" class="layui-input input-radius" placeholder="请输入邮箱">
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="layui-input-block" style="text-align: center;padding-right: 7%">
                <button type="button" class="layui-btn layui-btn-radius" lay-submit="" lay-filter="doSubmit" id="doSubmit"><i
                        class="layui-icon layui-icon-search layui-icon-normal"></i>提交
                </button>
                <button type="reset" class="layui-btn layui-btn-radius layui-btn-warm"><i
                        class="layui-icon layui-icon-refresh"></i><span>重置</span>
                </button>
            </div>
        </div>
    </form>
</div>

<script type="text/javascript" src="../resources/layui/layui.js"></script>

<script type="text/javascript">

    //提升数据表格的作用域，因为底下还有一个reloadTable方法
    var tableIns;

	layui.use(['jquery',  'form', 'layer', 'table', 'upload', 'element'], function () {
	    var $ = layui.jquery; 
	    var form = layui.form; 
	    var layer = layui.layer; 
	    var table = layui.table; 
	    var upload = layui.upload; 
	    var element = layui.element;

		var selectedFile = null;
		 
		// 文件选择按钮点击事件 
		$('#select-file').click(function(){
		    $('#file-input').click();
		});
		 
		// 文件选择变化事件 
		$('#file-input').change(function(e){
		    if(this.files  && this.files.length  > 0){
		        selectedFile = this.files[0]; 
		        
		        // 验证文件类型 
		        var fileExt = selectedFile.name.split('.').pop().toLowerCase(); 
		        if(!['xlsx','xls'].includes(fileExt)){
		            layer.msg(' 请选择Excel文件(xlsx或xls格式)', {icon: 2});
		            return;
		        }
		        
		        // 验证文件大小(100MB限制)
		        if(selectedFile.size  > 100 * 1024 * 1024){
		            layer.msg(' 文件大小不能超过100MB', {icon: 2});
		            return;
		        }
		        
		        $('#file-name').text(selectedFile.name).css('color','#333'); 
		    }
		});
		 
		// 导入按钮点击事件 
		$('#import-btn').click(function(){
		    if(!selectedFile){
		        layer.msg(' 请先选择Excel文件', {icon: 2});
		        return;
		    }
		    
		    // 显示加载层 
		    var loadIndex = layer.load(2); 
		    
		    // 显示进度条 
		    $('#progress-container').show();
		    element.progress('import-progress',  '0%');
		    
		    // 使用FormData上传文件 
		    var formData = new FormData();
		    formData.append('file',  selectedFile);
		    
		    // 使用原生AJAX上传 
		    var xhr = new XMLHttpRequest();
		    xhr.open('POST',  '/excel/importcustomer', true);
		    
		    xhr.upload.onprogress  = function(e) {
		        if(e.lengthComputable){ 
		            var percent = Math.round((e.loaded  / e.total)  * 100);
		            element.progress('import-progress',  percent + '%');
		        }
		    };
		    
		    xhr.onload  = function() {
		        layer.close(loadIndex); 
		        if(xhr.status  === 200){
		            try {
		                var res = JSON.parse(xhr.responseText); 
		                if(res.code  === 200){
		                    showImportResult(res);
		                    tableIns.reload(); 
		                } else {
		                    showErrorResult(res.msg  || '导入失败');
		                }
		            } catch(e) {
		                showErrorResult('解析服务器响应失败');
		            }
		        } else {
		            showErrorResult('服务器错误: ' + xhr.status); 
		        }
		    };
		    
		    xhr.onerror  = function() {
		        layer.close(loadIndex); 
		        showErrorResult('网络错误，请检查连接');
		    };
		    
		    xhr.send(formData); 
		});
		 
		// 显示导入结果 
		function showImportResult(res) {
		    var html = '<div style="color:green">导入成功！</div>' +
		               '<div>总记录数: ' + res.data.total  + '</div>' +
		               '<div>成功: ' + res.data.successCount  + '</div>' +
		               '<div>失败: ' + res.data.failureCount  + '</div>';
		    
		    if(res.data.failureCount  > 0) {
		        html += '<div style="margin-top:10px;">' +
		                '<a href="javascript:void(0)" class="layui-btn layui-btn-xs" id="show-error">查看失败详情</a>' +
		                '<div id="error-detail" style="display:none;margin-top:10px;padding:10px;background:#f2f2f2;">';
		        
		        res.data.errorMessages.forEach(function(error,  index) {
		            html += '<p>' + (index + 1) + '. 行号: ' + error.row  + ', 错误: ' + error.message  + '</p>';
		        });
		        
		        html += '</div></div>';
		        
		        $('#import-result').html(html);
		        
		        $('#show-error').click(function(){
		            $('#error-detail').toggle();
		        });
		    } else {
		        $('#import-result').html(html);
		    }
		}
		 
		// 显示错误结果 
		function showErrorResult(message) {
		    element.progress('import-progress',  '0%');
		    $('#import-result').html('<div style="color:red">' + message + '</div>');
		}
		 
		// 模板下载功能 
		$('#download-template').click(function(){
		    window.location.href  = '/excel/customertemplate';
		});

        //初始化表格 加载数据
        tableIns = table.render({
            elem: "#customerTable",
            title: "客户数据表格",
            url: "/customer/loadAllCustomer",
            toolbar: "#customerToolBar",
            page: true,
            height: "full-180",
            cols: [ [
                {type:'checkbox',fixed:'left'},
                {field: 'id', title: 'ID', align: 'center',width:'50'},
                {field: 'customername', title: '客户名称', align: 'center',width:'100'},
                {field: 'address', title: '客户地址', align: 'center',width:'150'},
                {field: 'connectionpersion', title: '联系人', align: 'center',width:'130'},
                {field: 'phone', title: '联系人电话', align: 'center',width:'130'},
                {field: 'email', title: '邮箱', align: 'center',width:'200'},
                {fixed: 'right', title: '操作', toolbar: '#customerRowBar', align: 'center',width:'180'}
            ] ],
            done: function (data, curr, count) {
                //不是第一页时，如果当前返回的数据为0那么就返回上一页
                if (data.data.length == 0 && curr != 1) {
                    tableIns.reload({
                        page: {
                            curr: curr - 1
                        }
                    })
                }
            }
        });

        //监控模糊查询按钮事件
        form.on("submit(doSearch)", function (data) {
            tableIns.reload({
                where: data.field,
                page: {
                    curr: 1
                }
            });
            return false;
        });

        //监控工具条事件
        table.on("toolbar(customerTable)", function (obj) {
            switch (obj.event) {
                case 'add':
                    openAddLayer();
                    break;
                case 'deleteBatch':
                    batchDeleteCustomer();
                    break;
            };
        });

        //监控行工具条事件
        table.on("tool(customerTable)", function (obj) {
            //获取当前行数据
            var data = obj.data;
            switch (obj.event) {
                case 'delete':
                    deleteCustomer(data);
                    break;
                case 'update':
                    updateCustomer(data);
                    break;
            };
        });

        var mainIndex;
        var url;

        //打开添加弹出层
        function openAddLayer() {
            mainIndex = layer.open({
                type:1,
                content:$("#addOrUpdateDiv"),
                area:['700px','500px'],
                title:'添加客户',
                success:function () {
                    $("#dataFrm")[0].reset();
                    url="/customer/addCustomer";
                }
            });
        }

        //打开修改的弹出层
        function updateCustomer(data) {
            mainIndex = layer.open({
                type:1,
                content:$("#addOrUpdateDiv"),
                area:['700px','500px'],
                title:'修改客户',
                success:function () {
                    //清空原有的数据
                    $("#dataFrm")[0].reset();
                    //装载新的数据
                    form.val("dataFrm",data);
                    url="/customer/updateCustomer";
                }
            });
        }

        form.on("submit(doSubmit)",function (data) {
            $.post(url,data.field,function (res) {
                if (res.code==200){
                    tableIns.reload();
                }
                layer.msg(res.msg);
                layer.close(mainIndex);
            });
            return false;
        });


        //删除
        function deleteCustomer(data) {
            layer.confirm('你确定要删除【' + data.customername + '】这个客户吗？', {icon: 3, title: '提示'}, function (index) {
                $.post("/customer/deleteCustomer", {id: data.id},function (res) {
                    if (res.code == 200) {
                        tableIns.reload({
                            where:"",
                        });
                    }
                    layer.msg(res.msg);
                });
                layer.close(index);
            });
        }



    });


</script>

</body>
</html>
