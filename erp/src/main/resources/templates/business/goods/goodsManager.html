<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <meta charset="UTF-8">
    <title>商品管理</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta http-equiv="Access-Control-Allow-Origin" content="*">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" href="../resources/favicon.ico">
    <link rel="stylesheet" href="../resources/layui/css/layui.css"  media="all"/>
    <link rel="stylesheet" href="../resources/css/public.css" media="all"/>
    <link rel="stylesheet" href="../resources/layui_ext/dtree/dtree.css" media="all"/>
    <link rel="stylesheet" href="../resources/layui_ext/dtree/font/dtreefont.css" media="all"/>
    <style>
        input#search_provideridTree_select_input_id {
            border-radius: 10px;
            height: 30px;
            margin-top: 4px;
        }
        input#provideridTree_select_input_id {
            border-radius: 10px;
            height: 30px;
            margin-top: 4px;
        }
        input#leaderprovideridTree_select_input_id {
            border-radius: 10px;
            height: 30px;
            margin-top: 4px;
        }
        input.layui-input.layui-unselect {
            border-radius: 10px;
            height: 30px;
            margin-top: 4px;
        }
		label.layui-form-label {
		    width: 220px !important;  /* 默认宽度为120px，调整为180px或更大 */
		    white-space: nowrap;      /* 禁止换行 */
		    overflow: visible;        /* 允许内容溢出（避免被隐藏） */
		}
    </style>
</head>
<body>
<!--查询条件-->
<fieldset class="layui-elem-field layui-field-title" style="margin-top: 15px;">
    <legend>search criteria(搜索条件)</legend>
</fieldset>
<form action="" method="post" id="searchFrm" lay-filter="searchFrm" class="layui-form">
    <div class="layui-form-item">
		<div class="layui-inline">
		    <label class="layui-form-label">Model(产品型号)</label>
		    <div class="layui-input-inline">
		        <input type="text" name="productcode" id="productcode" autocomplete="off" class="layui-input input-radius" placeholder="Please enter the model number">
		    </div>
		</div>

		<div class="layui-inline">
		    <label class="layui-form-label">Remark(产品规格)</label>
		    <div class="layui-input-inline">
		        <input type="text" name="size" id="size" autocomplete="off" class="layui-input input-radius" placeholder="Please enter the remark">
		    </div>
		</div>
	</div>
	<div class="layui-form-item">
		<div class="layui-inline">
				             <label class="layui-form-label">Product Name(产品名称)</label>
						    <div class="layui-input-inline">
						  	  	<select name="goodsname" id="goodsname" autocomplete="off" placeholder="Please select the product name">
						      		<option value="">Please select the product name</option>
						  	  		<option value="Toner Cartridge-硒鼓">Toner Cartridge-硒鼓</option>
						  	 		<option value="Ink Cartridge-墨盒">Ink Cartridge-墨盒</option>
						  	  		<option value="Ink-墨水">Ink-墨水</option>
						  	 		<option value="Parts-配件">Parts-配件</option>
						  	  		<option value="Box-纸盒">Box-纸盒</option>
						  	 	</select>
						      </div>
		</div>
		<div class="layui-inline">
						    <label class="layui-form-label">Provider(商品供应商)</label>
						    <div class="layui-input-inline">
						        <select name="providerid" id="select_providerid" autocomplete="off">
						            <option value="0">Please select the provider</option>
						        </select>
						    </div>
		</div>
    </div>
	<div class="layui-form-item">
	    <div class="layui-input-block" style="text-align: center;padding-right: 15%;">
            <button type="button" class="layui-btn layui-btn-sm layui-btn-radius" lay-submit="" lay-filter="doSearch"><i
                    class="layui-icon layui-icon-search layui-icon-normal"></i>Query(查询)
            </button>
            <button type="reset" class="layui-btn layui-btn-sm layui-btn-radius layui-btn-warm"><i
                    class="layui-icon layui-icon-refresh"></i><span>Reset(重置)</span>
            </button>
        </div>
	</div>
</form>
<fieldset class="layui-elem-field layui-field-title" style="margin-top: 15px;">
    <legend>Import Data(导入数据)</legend>
</fieldset>
<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form" lay-filter="import-form">
            <div class="layui-form-item">
                <label class="layui-form-label">Choose File</label>
                <div class="layui-input-inline">
                    <button type="button" class="layui-btn" id="select-file">
                        <i class="layui-icon">&#xe67c;</i>Choose Excel File
                    </button>
                    <input type="file" id="file-input" style="display:none" accept=".xlsx,.xls">
                </div>
				<div class="layui-input-inline">
				     <span id="file-name" style="color:#666;"></span>
				</div>
				<div class="layui-input-inline">
				      <button type="button" class="layui-btn layui-btn-normal" id="import-btn">
				         <i class="layui-icon layui-icon-upload"></i>Start Import
				      </button>
				 </div>
                <div class="layui-input-inline">
                    <button type="button" class="layui-btn layui-btn-primary" id="download-template">
                        <i class="layui-icon">&#xe601;</i>Download Template
                    </button>
                </div>
            </div>
        </form>
        
        <div id="progress-container" style="display: none; margin-top: 20px;">
            <div class="layui-progress" lay-showpercent="true" lay-filter="import-progress">
                <div class="layui-progress-bar" lay-percent="0%"></div>
            </div>
            <div id="import-result" style="margin-top: 10px;"></div>
        </div>
    </div>
</div>
<!--数据表格-->
<div>
    <table class="layui-hide" id="goodsTable" lay-filter="goodsTable"></table>
    <div id="goodsToolBar" style="display: none">
        <button type="button" lay-event="add" shiro:hasPermission="goods:create" class="layui-btn layui-btn-sm layui-btn-normal layui-btn-radius">
            <i class="layui-icon layui-icon-add-1"></i>Add Product(添加商品)
        </button>
    </div>
    <div id="goodsRowBar" style="display: none;">
        <button type="button" lay-event="update" shiro:hasPermission="goods:update" class="layui-btn layui-btn-sm layui-btn-radius"><i
                class="layui-icon layui-icon-edit"></i>Edit(编辑)
        </button>
        <button type="button" lay-event="delete" shiro:hasPermission="goods:delete" class="layui-btn layui-btn-sm layui-btn-danger layui-btn-radius"><i
                class="layui-icon layui-icon-delete"></i>Delete(删除)
        </button>
    </div>
</div>

<!--添加和修改弹出层-->
<div id="addOrUpdateDiv" style="display: none;padding: 10px;padding-right: 5%">
    <form action="" method="post" class="layui-form" id="dataFrm" lay-filter="dataFrm">
        <div class="layui-col-md12 layui-col-xs12">
            <div class="layui-row layui-col-space10">
                <div class="layui-col-md9 layui-col-xs7">
					<div class="layui-form-item">
						<div class="layui-inline">
					    <label class="layui-form-label">Provider(商品供应商)</label>
							<div class="layui-input-inline">
					        <select name="providerid" id="providerid" autocomplete="off">
					            <option value="0">Please select the provider</option>
					        </select>
							</div>
					    </div>

					    <div class="layui-inline">
					    <label class="layui-form-label">Product Name(产品名称)</label>
							<div class="layui-input-inline">
							<select name="goodsname" id="goodsname" autocomplete="off" placeholder="Please select the product name">
													<option value="">Please select the product name</option>
													<option value="Toner Cartridge-硒鼓">Toner Cartridge-硒鼓</option>
													<option value="Ink Cartridge-墨盒">Ink Cartridge-墨盒</option>
													<option value="Ink-墨水">Ink-墨水</option>
													<option value="Parts-配件">Parts-配件</option>
													<option value="Box-纸盒">Box-纸盒</option>
							</select>
							</div>
					     </div>
					</div>
					
					<div class="layui-form-item">
						<div class="layui-inline">
						    <label class="layui-form-label">Model(型号)</label>
						    <div class="layui-input-inline">
								<input type="hidden" name="id">
						        <input type="text" class="layui-input input-radius" name="productcode" autocomplete="off" lay-verify="required" placeholder="Please enter the model number">
						    </div>
						</div>
						<div class="layui-inline">
						     <label class="layui-form-label">Compatible for(机型)</label>
						     <div class="layui-input-inline">
						         <input type="text" class="layui-input input-radius" name="description" autocomplete="off" lay-verify="required" placeholder="Please enter the Compatible for">
						     </div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline">
						     <label class="layui-form-label">Remark(规格)</label>
						     <div class="layui-input-inline">
						         <input type="text" class="layui-input input-radius" name="size" autocomplete="off" lay-verify="required" placeholder="Please enter the remark">
						     </div>
						</div>
						<div class="layui-inline">
						     <label class="layui-form-label">ORIG Qty(数量-初始库存)</label>
						     <div class="layui-input-inline">
						         <input type="text" class="layui-input input-radius" name="number" autocomplete="off" lay-verify="required" placeholder="Please enter the number">
						     </div>
						</div>
					</div>
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="layui-input-block" style="text-align: center;padding-right: 7%">
                <button type="button" class="layui-btn layui-btn-radius" lay-submit="" lay-filter="doSubmit" id="doSubmit"><i
                        class="layui-icon layui-icon-search layui-icon-normal"></i>Submit(提交)
                </button>
                <button type="reset" class="layui-btn layui-btn-radius layui-btn-warm"><i
                        class="layui-icon layui-icon-refresh"></i><span>Reset(重置)</span>
                </button>
            </div>
        </div>
    </form>
</div>

<script type="text/javascript" src="../resources/layui/layui.js"></script>

<script type="text/javascript">

    //提升数据表格的作用域，因为底下还有一个reloadTable方法
    var tableIns;

    layui.use(['jquery',  'form', 'layer', 'table', 'upload', 'element'], function () {
	    var $ = layui.jquery; 
	    var form = layui.form; 
	    var layer = layui.layer; 
	    var table = layui.table; 
	    var upload = layui.upload; 
	    var element = layui.element;

		var selectedFile = null;
		 
		// 文件选择按钮点击事件 
		$('#select-file').click(function(){
		    $('#file-input').click();
		});
		 
		// 文件选择变化事件 
		$('#file-input').change(function(e){
		    if(this.files  && this.files.length  > 0){
		        selectedFile = this.files[0]; 
		        
		        // 验证文件类型 
		        var fileExt = selectedFile.name.split('.').pop().toLowerCase(); 
		        if(!['xlsx','xls'].includes(fileExt)){
		            layer.msg(' 请选择Excel文件(xlsx或xls格式)', {icon: 2});
		            return;
		        }
		        
		        // 验证文件大小(100MB限制)
		        if(selectedFile.size  > 100 * 1024 * 1024){
		            layer.msg(' 文件大小不能超过100MB', {icon: 2});
		            return;
		        }
		        
		        $('#file-name').text(selectedFile.name).css('color','#333'); 
					} else {
					    // 如果没有选择文件，则重置状态 
					    resetFileSelection();
					}
			    });
			     
			    $('#import-btn').click(function(){
			        if(!selectedFile){
			            layer.msg(' 请先选择Excel文件', {icon: 2});
			            return;
			        }
					
					// 重置进度条和结果区域 
					$('#progress-container').show();
					element.progress('import-progress',  '0%');
					$('#import-result').html('');
			        
			        var loadIndex = layer.load(2);  
			        $('#progress-container').show();
			        element.progress('import-progress',  '0%');
			        
			        var formData = new FormData();
			        formData.append('file',  selectedFile);
			        
			        var xhr = new XMLHttpRequest();
			        xhr.open('POST',  '/excel/importgoods', true);
			        
			        xhr.upload.onprogress  = function(e) {
			            if(e.lengthComputable){  
			                var percent = Math.round((e.loaded  / e.total)  * 100);
			                element.progress('import-progress',  percent + '%');
			            }
			        };
			        
			        xhr.onload  = function() {
			            layer.close(loadIndex);  
			            if(xhr.status  === 200){
			                try {
			                    var res = JSON.parse(xhr.responseText);  
			                    if(res.code  === 200){
			                        showImportResult(res);
			                        tableIns.reload();  
			                    } else {
			                        showErrorResult(res.msg  || '导入失败');
			                    }
			                } catch(e) {
			                    showErrorResult('解析服务器响应失败');
			                }
			            } else {
			                showErrorResult('服务器错误: ' + xhr.status);  
			            }
			        };
			        
			        xhr.onerror  = function() {
			            layer.close(loadIndex);  
			            showErrorResult('网络错误，请检查连接');
			        };
			        
			        xhr.send(formData);  
			    });
			    
				// 在导入成功或失败后，重置文件选择状态 
				function resetFileSelection() {
				    selectedFile = null;
				    $('#file-input').val(''); // 清空文件输入 
				    $('#file-name').text('').css('color','#666');
				}
				 
			    function showImportResult(res) {
			        var html = '<div style="color:green">导入成功！</div>' +
			                   '<div>总记录数: ' + res.data.total  + '</div>' +
			                   '<div>成功: ' + res.data.successCount  + '</div>' +
			                   '<div>失败: ' + res.data.failureCount  + '</div>';
			        
			        if(res.data.failureCount  > 0) {
			            html += '<div style="margin-top:10px;">' +
			                    '<a href="javascript:void(0)" class="layui-btn layui-btn-xs" id="show-error">查看失败详情</a>' +
			                    '<div id="error-detail" style="display:none;margin-top:10px;padding:10px;background:#f2f2f2;">';
			            
			            res.data.errorMessages.forEach(function(error,  index) {
			                html += '<p>' + (index + 1) + '. 行号: ' + error.row  + ', 错误: ' + error.message  + '</p>';
			            });
			            
			            html += '</div></div>';
			            
			            $('#import-result').html(html);
			            
			            $('#show-error').click(function(){
			                $('#error-detail').toggle();
			            });
			        } else {
			            $('#import-result').html(html);
			        }

					// 重置文件选择状态 
					resetFileSelection();
			    }
			     
			    function showErrorResult(message) {
			        element.progress('import-progress',  '0%');
			        $('#import-result').html('<div style="color:red">' + message + '</div>');
					
					// 重置文件选择状态 
					resetFileSelection();
			    }
			     
				// 模板下载功能 
				$('#download-template').click(function(){
				    window.location.href  = '/excel/goodstemplate';
				});
		
        //初始化表格 加载数据
        tableIns = table.render({
            elem: "#goodsTable",
            title: "商品数据表格",
            url: "/goods/loadAllGoods",
            toolbar: "#goodsToolBar",
            page: true,
			limit: '9999999',  // 默认单页模式 
			limits: [9999999,10, 20, 50, 100,], // 分页选项 
            height: "full-180",
            cols: [ [
				{field: 'goodsname', title: 'Product Name<br/>产品名称', align: 'center',width:'200'},
				{field: 'description', title: 'Compatible for<br/>产品机型', align: 'center', width:'300'},
				{field: 'productcode', title: 'Model<br/>产品型号', align: 'center',width:'500'},
				{field: 'size', title: 'Remark<br/>产品规格', align: 'center',width:'500'},
				{field: 'number', title: 'ORIG Qty<br/>数量-初始库存', align: 'center',width:'200'},
				{field: 'in_count', title: 'Inport Qty<br/>数量-入库', align: 'center',width:'200'},
				{field: 'out_count', title: 'Sales Qty<br/>数量-销售', align: 'center',width:'200'},
				{field: 'actual_count', title: 'ACT. Qty<br/>数量-实际库存', align: 'center',width:'200'},
                {fixed: 'right', title: 'execute<br/>操作', toolbar: '#goodsRowBar', align: 'center',width:'250'}
            ] ],
            done: function (data, curr, count) {
                //不是第一页时，如果当前返回的数据为0那么就返回上一页
                if (data.data.length == 0 && curr != 1) {
                    tableIns.reload({
                        page: {
                            curr: curr - 1
                        }
                    })
                }
            }
        });
		
        //初始化查询条件的下拉列表
        $.get("/provider/loadAllProviderForSelect",function (res) {
            var data = res.data;
            var dom = $("#select_providerid");
            var html = '<option value="">Please select the provider</option>';
            $.each(data,function (index, item) {
                html += '<option value="'+item.id+'">'+item.providername+'</option>';
            })
            dom.html(html);
            //重新渲染下拉列表
            form.render("select");
        });

        //监控模糊查询按钮事件
        form.on("submit(doSearch)", function (data) {
            tableIns.reload({
                where: data.field,
                page: {
                    curr: 1
                }
            });
            return false;
        });

        //监控工具条事件
        table.on("toolbar(goodsTable)", function (obj) {
            switch (obj.event) {
                case 'add':
                    openAddLayer();
                    break;
                case 'deleteBatch':
                    batchDeleteGoods();
                    break;
            };
        });

        //监控行工具条事件
        table.on("tool(goodsTable)", function (obj) {
            //获取当前行数据
            var data = obj.data;
            switch (obj.event) {
                case 'delete':
                    deleteGoods(data);
                    break;
                case 'update':
                    updateGoods(data);
                    break;
            };
        });


        var mainIndex;
        var url;

        //打开添加弹出层
        function openAddLayer() {
            mainIndex = layer.open({
                type:1,
                content:$("#addOrUpdateDiv"),
                area:['1500px','700px'],
                title:'添加商品',
                success:function () {
                    $("#dataFrm")[0].reset();
                    url="/goods/addGoods";
                    $.get("/provider/loadAllProviderForSelect",function(res){
                        var data=res.data;
                        var dom=$("#providerid");
                        var html='<option value="">Please select the provider</option>'
                        $.each(data,function(index,item){
                            html+='<option value="'+item.id+'">'+item.providername+'</option>'
                        });
                        dom.html(html);
                        form.render("select");
                    });
                }
            });
        }

        //打开修改的弹出层
        function updateGoods(data) {
            mainIndex = layer.open({
                type:1,
                content:$("#addOrUpdateDiv"),
                area:['1500px','700px'],
                title:'Edit Product(修改商品)',
                success:function () {
                    //清空原有的数据
                    $("#dataFrm")[0].reset();
                    //装载新的数据
                    form.val("dataFrm",data);
                    
                    //下拉列表的回显
                    $.get("/provider/loadAllProviderForSelect",function(res){
                        var redata=res.data;
                        var dom=$("#providerid");
                        var html='<option value="">Please select the provider</option>'
                        $.each(redata,function(index,item){
                            if (data.providerid===item.id){
                                html+='<option value="'+item.id+'" selected>'+item.providername+'</option>'
                            }else {
                                html+='<option value="'+item.id+'">'+item.providername+'</option>'
                            }
                        });
                        dom.html(html);
                        form.render("select");
                    });
                    url="/goods/updateGoods";
                }
            });
        }

        form.on("submit(doSubmit)",function (data) {
            $.post(url,data.field,function (res) {
                if (res.code==200){
                    tableIns.reload();
                }
                layer.msg(res.msg);
                layer.close(mainIndex);
            });
            return false;
        });

        //删除
        function deleteGoods(data) {
            layer.confirm('你确定要删除【' + data.goodsname + '】这个商品吗？删除该商品，其商品进货、商品退货、商品销售、商品销售退货将会同步删除！', {icon: 3, title: '提示'}, function (index) {
                $.post("/goods/deleteGoods", {id: data.id,goodsimg:data.goodsimg},function (res) {
                    if (res.code == 200) {
                        tableIns.reload({
                            where:"",
                        });
                    }
                    layer.msg(res.msg);
                });
                layer.close(index);
            });
        }


    });


</script>

</body>
</html>
