<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <meta charset="UTF-8">
    <title>商品退货管理</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta http-equiv="Access-Control-Allow-Origin" content="*">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" href="../resources/favicon.ico">
    <link rel="stylesheet" href="../resources/layui/css/layui.css"  media="all"/>
    <link rel="stylesheet" href="../resources/css/public.css" media="all"/>
    <link rel="stylesheet" href="../resources/layui_ext/dtree/dtree.css" media="all"/>
    <link rel="stylesheet" href="../resources/layui_ext/dtree/font/dtreefont.css" media="all"/>
    <style>
        input#search_customeridTree_select_input_id {
            border-radius: 10px;
            height: 30px;
            margin-top: 4px;
        }
        input#customeridTree_select_input_id {
            border-radius: 10px;
            height: 30px;
            margin-top: 4px;
        }
        input#leadercustomeridTree_select_input_id {
            border-radius: 10px;
            height: 30px;
            margin-top: 4px;
        }
        input.layui-input.layui-unselect {
            border-radius: 10px;
            height: 30px;
            margin-top: 4px;
        }
        input#search_goodsidTree_select_input_id {
            border-radius: 10px;
            height: 30px;
            margin-top: 4px;
        }
        input#goodsidTree_select_input_id {
            border-radius: 10px;
            height: 30px;
            margin-top: 4px;
        }
        input#leadergoodsidTree_select_input_id {
            border-radius: 10px;
            height: 30px;
            margin-top: 4px;
        }
        input.layui-input.layui-unselect {
            border-radius: 10px;
            height: 30px;
            margin-top: 4px;
        }
		label.layui-form-label {
		    width: 200px !important;  /* 默认宽度为120px，调整为180px或更大 */
		    white-space: nowrap;      /* 禁止换行 */
		    overflow: visible;        /* 允许内容溢出（避免被隐藏） */
		}
    </style>
</head>
<body>
<!--查询条件-->
<fieldset class="layui-elem-field layui-field-title" style="margin-top: 15px;">
    <legend>search criteria(搜索条件)</legend>
</fieldset>
<form action="" method="post" id="searchFrm" lay-filter="searchFrm" class="layui-form">
	<div class="layui-form-item">
	   		 <div class="layui-inline">
	            <label class="layui-form-label">Client's ID(客户代码)</label>
				<div class="layui-input-inline">
	                <select name="customerid" id="select_customerid" autocomplete="off" lay-filter="select_customerid" lay-search>
	                    <option value="">Please select the client's ID</option>
	                </select>
	       		 </div>
			 </div>
			 <div class="layui-inline">
			     <label class="layui-form-label">Order No.(订单号) </label>
				 <div class="layui-input-inline">
				 		<select name="orderno" id="select_orderid" autocomplete="off" lay-search>
				 			    <option value="">Please select the Order No</option>
				 		</select>
				 </div>
			 </div>
	</div>
	 

	<div class="layui-form-item">
            <label class="layui-form-label">Product Name(产品名称)</label>
            <div class="layui-input-inline" style="width: 800px;">
                <select name="goodsid" id="select_goodsid" autocomplete="off" lay-search>
                    <option value="">Please select or input the product name</option>
                </select>
            </div>
    </div>
		
	<div class="layui-form-item">
		    <label class="layui-form-label">Salesback Date(退货日期)</label>
		    <div class="layui-input-inline" style="width: 300px;">
		        <input type="text" class="layui-input" id="salesDateRange"  autocomplete="off"  placeholder="Please select the Date Range">
		        <input type="hidden" name="startTime" id="startTime">
		        <input type="hidden" name="endTime" id="endTime">
		    </div>
    </div>
	
    <div class="layui-form-item">
        <div class="layui-input-block" style="text-align: center;padding-right: 15%;">
            <button type="button" class="layui-btn layui-btn-sm layui-btn-radius" lay-submit="" lay-filter="doSearch"><i
                    class="layui-icon layui-icon-search layui-icon-normal"></i>Query(查询)
            </button>
            <button type="reset" class="layui-btn layui-btn-sm layui-btn-radius layui-btn-warm"><i
                    class="layui-icon layui-icon-refresh"></i><span>Reset(重置)</span>
            </button>
        </div>
    </div>
</form>

<!--数据表格-->
<div>
    <table class="layui-hide" id="salesbackTable" lay-filter="salesbackTable"></table>
    <div id="salesbackRowBar" style="display: none;">
        <button type="button" lay-event="delete" shiro:hasPermission="salesback:delete" class="layui-btn layui-btn-sm layui-btn-danger layui-btn-radius"><i
                class="layui-icon layui-icon-delete"></i>Delete(删除)
        </button>
    </div>
</div>


<script type="text/javascript" src="../resources/layui/layui.js"></script>

<script type="text/javascript">

    //提升数据表格的作用域，因为底下还有一个reloadTable方法
    var tableIns;

    layui.use(['jquery', 'form', 'layer', 'table', 'laydate'], function () {
        var $ = layui.jquery;
        var form = layui.form;
        var layer = layui.layer;
        var table = layui.table;
        var laydate = layui.laydate;

		// 获取当天日期范围 
					    function getCurrentDateRange() {
					        var now = new Date();
					        var year = now.getFullYear(); 
					        var month = now.getMonth()  + 1;
					        var day = now.getDate(); 
					        
					        month = month < 10 ? '0' + month : month;
					        day = day < 10 ? '0' + day : day;
					        
					        var today = year + '-' + month + '-' + day;
					        return today + ' - ' + today;
					    }
					 
					    // 格式化日期对象为 yyyy-MM-dd 
					    function formatDate(dateObj) {
					        if (!dateObj) return '';
					        var year = dateObj.year; 
					        // 注意：laydate 的 month 已经是 0-11，直接 +1 即可 
					        var month = (dateObj.month).toString().padStart(2, '0');
					        var day = dateObj.date.toString().padStart(2,  '0');
					        return `${year}-${month}-${day}`;
					    }
					 
						// 初始化日期范围选择器 
						laydate.render({  
						    elem: '#salesDateRange',
						    type: 'date',
						    range: true,
						    trigger: 'click',
						    format: 'yyyy-MM-dd',
						    ready: function() {
						       
						    },
						    change: function(value, date, endDate) {
						        if (date && endDate) {
						            $('#startTime').val(formatDate(date));
						            $('#endTime').val(formatDate(endDate));
						        } else {
						            $('#startTime').val('');
						            $('#endTime').val('');
						        }
						    },
						    done: function(value, date, endDate) {
								// 用户取消选择时清空值 
								        if (!value) {
								            $('#salesDateRange').val('');
								            $('#startTime').val('');
								            $('#endTime').val('');
								            form.val("searchFrm",  {
								                startTime: '',
								                endTime: ''
								            });
								        } else if (value && date && endDate) {
								            var dates = value.split(/\s*  - \s*/);  
								            if (dates.length  >= 2) {
								                $('#startTime').val(dates[0].trim());
								                $('#endTime').val(dates[1].trim());
								                form.val("searchFrm",  {
								                    startTime: dates[0].trim(),
								                    endTime: dates[1].trim()
								                });
								            }
								        }
						    }
						});



        //初始化表格 加载数据
        tableIns = table.render({
            elem: "#salesbackTable",
            title: "进货数据表格",
            url: "/salesback/loadAllSalesback",
            toolbar: true,
            page: true,
			limit: '9999999',  // 默认单页模式 
			limits: [9999999,10, 20, 50, 100,], // 分页选项 
            height: "full-180",
            cols: [ [
				{field: 'orderno', title: 'Order No.<br/>订单号', align: 'center',width:'150'},
                {field: 'customerid', title: 'Client\'s Id<br/>客户代码', align: 'center',width:'130'},
				{field: 'productcode', title: 'Model<br/>产品型号', align: 'center',width:'500'},
				{field: 'size', title: 'Remark<br/>产品规格', align: 'center',width:'260'},
                {field: 'paytype', title: 'Paytype<br/>支付类型', align: 'center',width:'90'},
                {field: 'salesbacktime', title: 'Return Time<br/>退货时间', align: 'center',width:'170'},
                {field: 'operateperson', title: 'Sales Name<br/>销售员', align: 'center',width:'130'},
                {field: 'number', title: 'Return Qty<br/>退货数量', align: 'center',width:'100'},
                {field: 'salebackprice', title: 'Return Price<br/>退货价格', align: 'center',width:'120'},
				{field: 'sum', title: 'Sum<br/>总数', align: 'center',width:'120'				,
					 templet: function(d){
							return (parseFloat(d.number)  * parseFloat(d.salebackprice)).toFixed(2); 
					 }
				},
                {field: 'remark', title: 'Note<br/>备注', align: 'center',width:'130'},
                {fixed: 'right', title: 'execute<br/>操作', toolbar: '#salesbackRowBar', align: 'center',width:'150'}
            ] ],
            done: function (data, curr, count) {
                //不是第一页时，如果当前返回的数据为0那么就返回上一页
                if (data.data.length == 0 && curr != 1) {
                    tableIns.reload({
                        page: {
                            curr: curr - 1
                        }
                    })
                }
            }
        });

        //监控模糊查询按钮事件
        form.on("submit(doSearch)", function (data) {
			
			var params = {};
			    for (var key in data.field)  {
			        params[key] = data.field[key]  === "" ? null : data.field[key]; 
			    }
			
            tableIns.reload({
                where: params,
                page: {
                    curr: 1
                }
            });
            return false;
        });

        //监控行工具条事件
        table.on("tool(salesbackTable)", function (obj) {
            //获取当前行数据
            var data = obj.data;
            switch (obj.event) {
                case 'delete':
                    deleteSalesback(data);
                    break;
            };
        });

        //初始化客户名称的下拉列表
        $.get("/customer/loadAllCustomerForSelect",function (res) {
            var data = res.data;
            var dom = $("#select_customerid");
            var html = '<option value="">Please select the client\'s ID</option>';
            $.each(data,function (index, item) {
                html += '<option value="'+item.id+'">'+item.id+'</option>';
            })
            dom.html(html);
            //重新渲染下拉列表
            form.render("select");
        });
        //初始化商品名称的下拉列表
        $.get("/goods/loadAllGoodsForSelect",function (res) {
            var data = res.data;
            var dom = $("#select_goodsid");
            var html = '<option value="">Please select or input the product name</option>';
            $.each(data,function (index, item) {
                html += '<option value="'+item.id+'">'+item.goodsname+'-['+item.productcode+']-'+'['+item.size+']'+'</option>';
            });
            dom.html(html);
            //重新渲染下拉列表
            form.render("select");
        });
		
				

				// 初始化订单号下拉列表 
				function initOrderSelect(customerid) {
				    var url = customerid ? "/salesback/loadOrdersByCustomer?customerid=" + customerid : "/salesback/loadAllOrders";
				    
				    $.get(url, function(res) {
				        var data = res.data;  
				        var dom = $("#select_orderid");
				        var html = '<option value="">Please select the Order No</option>';
				        $.each(data, function(index, item) {
				            html += '<option value="' + item + '">' + item + '</option>';
				        });
				        dom.html(html);  
				        form.render("select");  
				    }).fail(function() {
				        layer.msg('Failed  to load orders', {icon: 2});
				    });
				}
				 
				// 页面加载时初始化订单号下拉列表 
				initOrderSelect();
				 
				// 监听客户代码下拉列表的变化 
				form.on('select(select_customerid)',  function(data) {
				    var customerid = data.value; 
				    if (customerid) {
				        initOrderSelect(customerid);
				    } else {
				        // 如果没有选择客户，加载所有订单 
				        initOrderSelect();
				    }
				});


        //删除退货信息
        function deleteSalesback(data) {
            layer.confirm('Do you wish to permanently remove this return record?(你确定要删除这条退货信息吗？)', {icon: 3, title: 'Alert(提示)'}, function (index) {
                $.post("/salesback/deleteSalesback", {id: data.id},function (res) {
                    if (res.code == 200) {
                        tableIns.reload({
                            where:"",
                        });
                    }
                    layer.msg(res.msg);
                });
                layer.close(index);
            });
        }


    });


</script>

</body>
</html>
