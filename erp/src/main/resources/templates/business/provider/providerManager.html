<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <meta charset="UTF-8">
    <title>供应商管理</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta http-equiv="Access-Control-Allow-Origin" content="*">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" href="../resources/favicon.ico">
    <link rel="stylesheet" href="../resources/layui/css/layui.css"  media="all"/>
    <link rel="stylesheet" href="../resources/css/public.css" media="all"/>
    <link rel="stylesheet" href="../resources/layui_ext/dtree/dtree.css" media="all"/>
    <link rel="stylesheet" href="../resources/layui_ext/dtree/font/dtreefont.css" media="all"/>
	<style>
		label.layui-form-label {
		    width: 250px !important;  /* 默认宽度为120px，调整为180px或更大 */
		    white-space: nowrap;      /* 禁止换行 */
		    overflow: visible;        /* 允许内容溢出（避免被隐藏） */
		}
	</style>
</head>
<body>
<!--查询条件-->
<fieldset class="layui-elem-field layui-field-title" style="margin-top: 15px;">
    <legend>search criteria(搜索条件)</legend>
</fieldset>
<form action="" method="post" id="searchFrm" lay-filter="searchFrm" class="layui-form">
    <div class="layui-form-item">
        <div class="layui-inline">
            <label class="layui-form-label">Provider name(供应商名称)</label>
            <div class="layui-input-inline">
                <input type="text" name="providername" id="providername" autocomplete="off"  class="layui-input input-radius"
                       placeholder="Please input the provider name">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">Connection Person's Name(联系人名称)</label>
            <div class="layui-input-inline">
                <input type="text" name="connectionperson" id="connectionperson"  autocomplete="off" class="layui-input input-radius" placeholder="Please input the Connection Person's Name">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">Phone Number(电话)</label>
            <div class="layui-input-inline">
                <input type="text" name="phone" id="phone"  autocomplete="off" class="layui-input input-radius" placeholder="Please input the phone number">
            </div>
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-block" style="text-align: center;padding-right: 15%;">
            <button type="button" class="layui-btn layui-btn-sm layui-btn-radius" lay-submit="" lay-filter="doSearch"><i
                    class="layui-icon layui-icon-search layui-icon-normal"></i>Query(查询)
            </button>
            <button type="reset" class="layui-btn layui-btn-sm layui-btn-radius layui-btn-warm"><i
                    class="layui-icon layui-icon-refresh"></i><span>Reset(重置)</span>
            </button>
        </div>
    </div>
</form>
<fieldset class="layui-elem-field layui-field-title" style="margin-top: 15px;">
    <legend>Import Data(导入数据)</legend>
</fieldset>
<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form" lay-filter="import-form">
            <div class="layui-form-item">
                <label class="layui-form-label">Choose File</label>
                <div class="layui-input-inline">
                    <button type="button" class="layui-btn" id="select-file">
                        <i class="layui-icon">&#xe67c;</i>Choose Excel File
                    </button>
                    <input type="file" id="file-input" style="display:none" accept=".xlsx,.xls">
                </div>
				<div class="layui-input-inline">
				     <span id="file-name" style="color:#666;"></span>
				</div>
				<div class="layui-input-inline">
				      <button type="button" class="layui-btn layui-btn-normal" id="import-btn">
				         <i class="layui-icon layui-icon-upload"></i>Start Import
				      </button>
				 </div>
                <div class="layui-input-inline">
                    <button type="button" class="layui-btn layui-btn-primary" id="download-template">
                        <i class="layui-icon">&#xe601;</i>Download Template
                    </button>
                </div>
            </div>
        </form>
        
        <div id="progress-container" style="display: none; margin-top: 20px;">
            <div class="layui-progress" lay-showpercent="true" lay-filter="import-progress">
                <div class="layui-progress-bar" lay-percent="0%"></div>
            </div>
            <div id="import-result" style="margin-top: 10px;"></div>
        </div>
    </div>
</div>
<!--数据表格-->
<div>
    <table class="layui-hide" id="providerTable" lay-filter="providerTable"></table>
    <div id="providerToolBar" style="display: none">
        <button type="button" lay-event="add" shiro:hasPermission="provider:create" class="layui-btn layui-btn-sm layui-btn-normal layui-btn-radius">
            <i class="layui-icon layui-icon-add-1"></i>Add Provider(添加供应商)
        </button>
    </div>
    <div id="providerRowBar" style="display: none;">
        <button type="button" lay-event="update" shiro:hasPermission="provider:update" class="layui-btn layui-btn-sm layui-btn-radius"><i
                class="layui-icon layui-icon-edit"></i>Edit(编辑)
        </button>
        <button type="button" lay-event="delete" shiro:hasPermission="provider:delete" class="layui-btn layui-btn-sm layui-btn-danger layui-btn-radius"><i
                class="layui-icon layui-icon-delete"></i>Delete(删除)
        </button>
    </div>
</div>

<!--添加和修改弹出层-->
<div id="addOrUpdateDiv" style="display: none;padding: 10px;padding-right: 5%">
    <form action="" method="post" class="layui-form" id="dataFrm" lay-filter="dataFrm">
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">Provider name(供应商名称)</label>
                <div class="layui-input-inline">
                    <input type="hidden" name="id">
                    <input type="text" name="providername" lay-verify="required" autocomplete="off"
                           class="layui-input input-radius" placeholder="Please input the provider name">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">Provider Address(供应商地址)</label>
                <div class="layui-input-inline">
                    <input type="text" name="address" lay-verify="required" autocomplete="off" class="layui-input input-radius" placeholder="Please input the provider address">
                </div>
            </div>

        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">Connection Person's Name(联系人名称）</label>
                <div class="layui-input-inline">
                    <input type="text" name="connectionperson" lay-verify="required" autocomplete="off" class="layui-input input-radius" placeholder="Please input the Connection Person's Name">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">Phone Number(电话)</label>
                <div class="layui-input-inline">
                    <input type="text" name="phone" lay-verify="required|number" autocomplete="off" class="layui-input input-radius" placeholder="Please input the phone number">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block" style="text-align: center;padding-right: 7%">
                <button type="button" class="layui-btn layui-btn-radius" lay-submit="" lay-filter="doSubmit" id="doSubmit"><i
                        class="layui-icon layui-icon-search layui-icon-normal"></i>Submit(提交)
                </button>
                <button type="reset" class="layui-btn layui-btn-radius layui-btn-warm"><i
                        class="layui-icon layui-icon-refresh"></i><span>Reset(重置)</span>
                </button>
            </div>
        </div>
    </form>
</div>

<script type="text/javascript" src="../resources/layui/layui.js"></script>

<script type="text/javascript">

    //提升数据表格的作用域，因为底下还有一个reloadTable方法
    var tableIns;

    layui.use(['jquery', 'form', 'layer', 'table', 'upload', 'element'], function () {
        var $ = layui.jquery;
        var form = layui.form;
        var layer = layui.layer;
        var table = layui.table;
		var upload = layui.upload; 
		var element = layui.element;

		var selectedFile = null;
		 
		// 文件选择按钮点击事件 
		$('#select-file').click(function(){
		    $('#file-input').click();
		});
		 
		// 文件选择变化事件 
		$('#file-input').change(function(e){
		    if(this.files  && this.files.length  > 0){
		        selectedFile = this.files[0]; 
		        
		        // 验证文件类型 
		        var fileExt = selectedFile.name.split('.').pop().toLowerCase(); 
		        if(!['xlsx','xls'].includes(fileExt)){
		            layer.msg(' 请选择Excel文件(xlsx或xls格式)', {icon: 2});
		            return;
		        }
		        
		        // 验证文件大小(100MB限制)
		        if(selectedFile.size  > 100 * 1024 * 1024){
		            layer.msg(' 文件大小不能超过100MB', {icon: 2});
		            return;
		        }
		        
		        $('#file-name').text(selectedFile.name).css('color','#333'); 
				} else {
				    // 如果没有选择文件，则重置状态 
				    resetFileSelection();
				}
			});
			 
			$('#import-btn').click(function(){
			    if(!selectedFile){
			        layer.msg(' 请先选择Excel文件', {icon: 2});
			        return;
			    }
				
				// 重置进度条和结果区域 
				$('#progress-container').show();
				element.progress('import-progress',  '0%');
				$('#import-result').html('');
			    
			    var loadIndex = layer.load(2);  
			    $('#progress-container').show();
			    element.progress('import-progress',  '0%');
			    
			    var formData = new FormData();
			    formData.append('file',  selectedFile);
			    
			    var xhr = new XMLHttpRequest();
			    xhr.open('POST',  '/excel/importprovider', true);
			    
			    xhr.upload.onprogress  = function(e) {
			        if(e.lengthComputable){  
			            var percent = Math.round((e.loaded  / e.total)  * 100);
			            element.progress('import-progress',  percent + '%');
			        }
			    };
			    
			    xhr.onload  = function() {
			        layer.close(loadIndex);  
			        if(xhr.status  === 200){
			            try {
			                var res = JSON.parse(xhr.responseText);  
			                if(res.code  === 200){
			                    showImportResult(res);
			                    tableIns.reload();  
			                } else {
			                    showErrorResult(res.msg  || '导入失败');
			                }
			            } catch(e) {
			                showErrorResult('解析服务器响应失败');
			            }
			        } else {
			            showErrorResult('服务器错误: ' + xhr.status);  
			        }
			    };
			    
			    xhr.onerror  = function() {
			        layer.close(loadIndex);  
			        showErrorResult('网络错误，请检查连接');
			    };
			    
			    xhr.send(formData);  
			});

			// 在导入成功或失败后，重置文件选择状态 
			function resetFileSelection() {
			    selectedFile = null;
			    $('#file-input').val(''); // 清空文件输入 
			    $('#file-name').text('').css('color','#666');
			}
			 
			function showImportResult(res) {
			    var html = '<div style="color:green">导入成功！</div>' +
			               '<div>总记录数: ' + res.data.total  + '</div>' +
			               '<div>成功: ' + res.data.successCount  + '</div>' +
			               '<div>失败: ' + res.data.failureCount  + '</div>';
			    
			    if(res.data.failureCount  > 0) {
			        html += '<div style="margin-top:10px;">' +
			                '<a href="javascript:void(0)" class="layui-btn layui-btn-xs" id="show-error">查看失败详情</a>' +
			                '<div id="error-detail" style="display:none;margin-top:10px;padding:10px;background:#f2f2f2;">';
			        
			        res.data.errorMessages.forEach(function(error,  index) {
			            html += '<p>' + (index + 1) + '. 行号: ' + error.row  + ', 错误: ' + error.message  + '</p>';
			        });
			        
			        html += '</div></div>';
			        
			        $('#import-result').html(html);
			        
			        $('#show-error').click(function(){
			            $('#error-detail').toggle();
			        });
			    } else {
			        $('#import-result').html(html);
			    }

				// 重置文件选择状态 
				resetFileSelection();
			}
			 
			function showErrorResult(message) {
			    element.progress('import-progress',  '0%');
			    $('#import-result').html('<div style="color:red">' + message + '</div>');
				
				// 重置文件选择状态 
				resetFileSelection();
			}
			 
			// 模板下载功能 
			$('#download-template').click(function(){
			    window.location.href  = '/excel/providertemplate';
			});

        //初始化表格 加载数据
        tableIns = table.render({
            elem: "#providerTable",
            title: "供应商数据表格",
            url: "/provider/loadAllProvider",
            toolbar: "#providerToolBar",
            page: true,
			limit: '9999999',  // 默认单页模式 
			limits: [9999999,10, 20, 50, 100,], // 分页选项 
            height: "full-180",
            cols: [ [
                {field: 'providername', title: 'Provider Name<br/>供应商名称', align: 'center',width:'200'},
                {field: 'address', title: 'Provider Address<br/>供应商地址', align: 'center',width:'200'},
                {field: 'connectionperson', title: 'Connection Person\'s Name<br/>联系人名称', align: 'center',width:'200'},
                {field: 'phone', title: 'Phone Number<br/>电话', align: 'center',width:'200'},
                {fixed: 'right', title: 'execute<br/>操作', toolbar: '#providerRowBar', align: 'center',width:'250'}
            ] ],
            done: function (data, curr, count) {
                //不是第一页时，如果当前返回的数据为0那么就返回上一页
                if (data.data.length == 0 && curr != 1) {
                    tableIns.reload({
                        page: {
                            curr: curr - 1
                        }
                    })
                }
            }
        });

        //监控模糊查询按钮事件
        form.on("submit(doSearch)", function (data) {
            tableIns.reload({
                where: data.field,
                page: {
                    curr: 1
                }
            });
            return false;
        });

        //监控工具条事件
        table.on("toolbar(providerTable)", function (obj) {
            switch (obj.event) {
                case 'add':
                    openAddLayer();
                    break;
                case 'deleteBatch':
                    batchDeleteProvider();
                    break;
            };
        });

        //监控行工具条事件
        table.on("tool(providerTable)", function (obj) {
            //获取当前行数据
            var data = obj.data;
            switch (obj.event) {
                case 'delete':
                    deleteProvider(data);
                    break;
                case 'update':
                    updateProvider(data);
                    break;
            };
        });

        var mainIndex;
        var url;

        //打开添加弹出层
        function openAddLayer() {
            mainIndex = layer.open({
                type:1,
                content:$("#addOrUpdateDiv"),
                area:['1500px','700px'],
                title:'Add Provider(添加供应商)',
                success:function () {
                    $("#dataFrm")[0].reset();
                    url="/provider/addProvider";
                }
            });
        }

        //打开修改的弹出层
        function updateProvider(data) {
            mainIndex = layer.open({
                type:1,
                content:$("#addOrUpdateDiv"),
                area:['1500px','700px'],
                title:'Edit Provider(修改供应商)',
                success:function () {
                    //清空原有的数据
                    $("#dataFrm")[0].reset();
                    //装载新的数据
                    form.val("dataFrm",data);
                    url="/provider/updateProvider";
                }
            });
        }

        form.on("submit(doSubmit)",function (data) {
            $.post(url,data.field,function (res) {
                if (res.code==200){
                    tableIns.reload();
                }
                layer.msg(res.msg);
                layer.close(mainIndex);
            });
            return false;
        });


        //删除
        function deleteProvider(data) {
            layer.confirm('你确定要删除【' + data.providername + '】这个供应商吗？删除该供应商将同时删除该供应商所供应的所有商品，以及和商品有关的进货、退货、销售进货、销售退货的所有信息！', {icon: 3, title: '提示'}, function (index) {
                $.post("/provider/deleteProvider", {id: data.id},function (res) {
                    if (res.code == 200) {
                        tableIns.reload({
                            where:"",
                        });
                    }
                    layer.msg(res.msg);
                });
                layer.close(index);
            });
        }



    });


</script>

</body>
</html>
