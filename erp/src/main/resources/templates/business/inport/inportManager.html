<script type="text/javascript" src="../resources/layui/layui.js"></script>

<script type="text/javascript" th:inline="none">

    //提升数据表格的作用域，因为底下还有一个reloadTable方法
    var tableIns;

    layui.use(['jquery', 'form', 'layer', 'table', 'laydate', 'upload', 'element'], function () {
		       var $ = layui.jquery; 
		       var form = layui.form; 
		       var layer = layui.layer; 
		       var table = layui.table; 
		       var laydate = layui.laydate; 
		       var upload = layui.upload;  
		       var element = layui.element; 
			   
			   // 获取当天日期范围 
			   			    function getCurrentDateRange() {
			   			        var now = new Date();
			   			        var year = now.getFullYear(); 
			   			        var month = now.getMonth()  + 1;
			   			        var day = now.getDate(); 
			   			        
			   			        month = month < 10 ? '0' + month : month;
			   			        day = day < 10 ? '0' + day : day;
			   			        
			   			        var today = year + '-' + month + '-' + day;
			   			        return today + ' - ' + today;
			   			    }
			   			 
			   			    // 格式化日期对象为 yyyy-MM-dd 
			   			    function formatDate(dateObj) {
			   			        if (!dateObj) return '';
			   			        var year = dateObj.year; 
			   			        // 注意：laydate 的 month 已经是 0-11，直接 +1 即可 
			   			        var month = (dateObj.month).toString().padStart(2, '0');
			   			        var day = dateObj.date.toString().padStart(2,  '0');
			   			        return `${year}-${month}-${day}`;
			   			    }
			   			 
			   				// 初始化日期范围选择器 
			   				laydate.render({  
			   				    elem: '#salesDateRange',
			   				    type: 'date',
			   				    range: true,
			   				    trigger: 'click',
			   				    format: 'yyyy-MM-dd',
								ready: function() {
								   
								},
			   				    change: function(value, date, endDate) {
			   				        if (date && endDate) {
			   				            $('#startTime').val(formatDate(date));
			   				            $('#endTime').val(formatDate(endDate));
			   				        } else {
			   				            $('#startTime').val('');
			   				            $('#endTime').val('');
			   				        }
			   				    },
								done: function(value, date, endDate) {
									// 用户取消选择时清空值 
									        if (!value) {
									            $('#salesDateRange').val('');
									            $('#startTime').val('');
									            $('#endTime').val('');
									            form.val("searchFrm",  {
									                startTime: '',
									                endTime: ''
									            });
									        } else if (value && date && endDate) {
									            var dates = value.split(/\s*  - \s*/);  
									            if (dates.length  >= 2) {
									                $('#startTime').val(dates[0].trim());
									                $('#endTime').val(dates[1].trim());
									                form.val("searchFrm",  {
									                    startTime: dates[0].trim(),
									                    endTime: dates[1].trim()
									                });
									            }
									        }
								}
			   				});



		       // 1. 初始化表单验证规则 
		       form.verify({ 
		           number: function(value, item) {
		               if(!/^\d+$/.test(value)) {
		                   return '只能输入整数';
		               }
		           },
		           price: function(value, item) {
		               if(!/^\d+(\.\d{1,2})?$/.test(value)) {
		                   return '请输入正确价格格式(如: 100 或 100.50)';
		               }
		           }
		       });

		       // 2. 初始化下拉框数据 
		       function initSelects() {
		           var loadIndex = layer.load(1,  {shade: 0.2});
		           
		           // 使用Promise.all 同时加载供应商和产品数据 
		           Promise.all([ 
		               $.get("/provider/loadAllProviderForSelect"),
		               $.get("/goods/loadAllGoodsForSelect")
		           ]).then(function(results) {
		               // 初始化供应商下拉 
		               var providerData = results[0].data;
		               var providerHtml = '<option value="">Please select the provider name</option>';
		               $.each(providerData, function(index, item) {
		                   providerHtml += '<option value="'+item.id+'">'+item.providername+'</option>'; 
		               });
		               $('#select_providerid, #providerid').html(providerHtml);
		               
		               // 初始化产品下拉 
		               var goodsData = results[1].data;
		               var goodsHtml = '<option value="">Please select the product name</option>';
		               $.each(goodsData, function(index, item) {
		                   goodsHtml += '<option value="'+item.id+'">'+ 
		                              item.goodsname+'-['+item.productcode+']-['+item.size+']'+ 
		                              '</option>';
		               });
		               $('#select_goodsid, #goodsid').html(goodsHtml);
		               
		               // 重新渲染下拉框 
		               form.render('select'); 
		           }).catch(function(error) {
		               layer.msg(' 加载数据失败: ' + (error.statusText  || '未知错误'));
		           }).finally(function() {
		               layer.close(loadIndex); 
		           });
		       }

		       // 3. 加载特定供应商的产品 
			   function loadGoodsByProvider(providerid, goodsid, callback) {
			       var url = providerid ? "/goods/loadGoodsByProviderId" : "/goods/loadAllGoodsForSelect";
			       var params = providerid ? {providerid: providerid} : {};
			       
			       $.get(url, params, function(res) {
			           if(res.code  == 0) {
			               var html = '<option value="">Please select the product name</option>';
			               $.each(res.data,  function(index, item) {
			                   var displayText = item.goodsname; 
			                   if(item.productcode)  displayText += '-[' + item.productcode  + ']';
			                   if(item.size)  displayText += '-[' + item.size  + ']';
			                   
			                   html += '<option value="'+item.id+'"'  + 
			                          (goodsid && item.id  == goodsid ? ' selected' : '') + '>' +
			                          displayText + '</option>';
			               });
			               
			               $('#goodsid').html(html);
			               form.render('select'); 
			               
			               if(callback) callback();
			           } else {
			               layer.msg(res.msg  || '加载产品失败: ' + (res.error  || ''));
			           }
			       }).fail(function(jqXHR, textStatus, errorThrown) {
						var errorMsg = '请求产品数据失败: ';
					    if(jqXHR.responseJSON  && jqXHR.responseJSON.message)  {
					        errorMsg += jqXHR.responseJSON.message; 
					    } else {
					        errorMsg += textStatus + ' ' + errorThrown;
					    }
					    layer.msg(errorMsg); 
					    console.error(' 加载产品失败详情:', jqXHR);
			       });
			   }

		       // 4. 页面加载完成后初始化 
		       initSelects();
		       
		       // 5. 监听供应商下拉变化 
		       form.on('select(providerid)',  function(data) {
		           loadGoodsByProvider(data.value); 
		       });

			   
			   // ================== 新增智能模糊搜索 ==================
			   // 1. 增强型防抖函数（支持立即执行）
			   function enhancedDebounce(func, wait, immediate) {
			       var timeout;
			       return function() {
			           var context = this, args = arguments;
			           var later = function() {
			               timeout = null;
			               if (!immediate) func.apply(context,  args);
			           };
			           var callNow = immediate && !timeout;
			           clearTimeout(timeout);
			           timeout = setTimeout(later, wait);
			           if (callNow) func.apply(context,  args);
			       };
			   }
			    
			   // 2. 智能搜索处理器 
			   function handleSmartSearch(elem) {
			       var $select = $(elem);
			       var $searchInput = $select.next('.layui-select-title').find('input'); 
			       var $options = $select.find('option'); 
			       
			       $searchInput.off('input').on('input',  enhancedDebounce(function() {
			           var keyword = $(this).val().toLowerCase().trim();
			           var hasMatch = false;
			           
			           $options.each(function()  {
			               var $option = $(this);
			               var matchResult = $option.text().toLowerCase().includes(keyword); 
			               $option.toggle(matchResult); 
			               if (matchResult) hasMatch = true;
			           });
			    
			           // 无结果提示 
			           if (!hasMatch && keyword) {
			               $select.append('<option  value="" disabled style="color:#ff5722">NO record</option>');
			           }
			           
			           form.render('select'); 
			       }, 300, true));
			   }
			    
			   // 3. 初始化所有搜索下拉框 
			   function initSmartSearch() {
			       $('select[lay-search]').each(function() {
			           handleSmartSearch(this);
			           
			           // 修复Layui搜索框点击穿透问题 
			           $(this).next('.layui-select-title').find('input').on('click', function(e) {
			               e.stopPropagation(); 
			           });
			       });
			   }
			    
			   // 执行初始化 
			   initSmartSearch();
			   // ================== 模糊搜索优化结束 ==================
			   
			   
		       // 6. 初始化表格 
        tableIns = table.render({
            elem: "#inportTable",
            title: "入库数据表格",
            url: "/inport/loadAllInport",
            toolbar: "#inportToolBar",
            page: true,
			limit: '9999999',  // 默认单页模式 
			limits: [9999999,10, 20, 50, 100,], // 分页选项 
            height: "full-180",
			cols: [[ 
			                {field: 'productcode', title: 'Model<br/>产品型号', align: 'center', width: '500'},
			                {field: 'size', title: 'Remark<br/>产品规格', align: 'center', width: '300'},
			                {field: 'inporttime', title: 'Inport Time<br/>入库时间', align: 'center', width: '170'},
			                {field: 'number', title: 'Inport Qty<br/>入库数量', align: 'center', width: '100'},
			                {field: 'inportprice', title: 'Inport Price(RMB)<br/>含运出厂价(人民币)', align: 'center', width: '160'},
							{field: 'sum', title: 'SUM(RMB)<br/>总价(人民币)', align: 'center', width: '130'							,
												  templet: function(d){
												        return (parseFloat(d.number)  * parseFloat(d.inportprice)).toFixed(2); 
												    }
												},
							{field: 'carton', title: 'Carton<br/>件数', align: 'center', width: '130'},
			                {field: 'remark', title: 'Note<br/>备注', align: 'center', width: '120'},
			                {fixed: 'right', title: 'execute<br/>操作', toolbar: '#inportRowBar', align: 'center', width: '250'}
			            ]],
			            done: function (data, curr, count) {
			                if (data.data.length  == 0 && curr != 1) {
			                    tableIns.reload({ 
			                        page: { curr: curr - 1 }
			                    });
			                }
			            }
			        });
			 
			        // 7. 监控模糊查询按钮事件 
			        form.on("submit(doSearch)",  function (data) {
			            tableIns.reload({ 
			                where: data.field, 
			                page: { curr: 1 }
			            });
			            return false;
			        });
			 
			        // 8. 监控工具条事件 
			        table.on("toolbar(inportTable)",  function (obj) {
			            switch (obj.event)  {
			                case 'add':
			                    openAddLayer();
			                    break;
			            }
			        });
			 
			        // 9. 监控行工具条事件 
			        table.on("tool(inportTable)",  function (obj) {
			            var data = obj.data; 
			            switch (obj.event)  {
			                case 'delete':
			                    deleteInport(data);
			                    break;
			                case 'update':
			                    updateInport(data);
			                    break;
			                case 'run':
			                    runInport(data);
			                    break;
			            }
			        });
					
					// 自动计算函数 
					function calculateTotal() {
					    // 获取数量和价格 
					    var number = parseFloat($('input[name="number"]').val()) || 0;
					    var price = parseFloat($('input[name="inportprice"]').val()) || 0;
					    
					    // 计算总价 
					    var total = number * price;
					    
					    // 更新总价字段，保留2位小数 
					    $('input[name="sum"]').val(total.toFixed(2));  
					}
					
			        // 10. 打开添加弹出层 
			        function openAddLayer() {
			            mainIndex = layer.open({ 
			                type: 1,
			                content: $("#addDiv"),
			                area: ['1500px', '700px'],
			                title: '添加入库',
			                success: function () {
			                    $("#addFrm")[0].reset();
								
								// 绑定自动计算事件 
								$('input[name="number"], input[name="inportprice"]').on('input', calculateTotal);
								
			                    url = "/inport/addInport";
			                }
			            });
			        }
			 
			        // 11. 打开修改弹出层 
			        function updateInport(data) {
			            mainIndex = layer.open({ 
			                type: 1,
			                content: $("#updateDiv"),
			                area: ['1500px', '700px'],
			                title: '修改商品入库',
			                success: function () {
								// 填充表单数据 
								form.val("updateFrm",  data);
								                    
								// 设置供应商和产品名称（只读）
								$("#providerName").val(data.providername); 
								$("#goodsName").val(data.goodsname  + "-[" + data.productcode  + "]-[" + data.size  + "]");
			                    
								// 初始计算（确保使用原始数据）
								var initNum = parseFloat(data.number)  || 0;
								var initPrice = parseFloat(data.inportprice)  || 0;
								$('#updateDiv input[name="sum"]').val((initNum * initPrice).toFixed(2));

								// 绑定自动计算事件（限定在updateDiv内）
								$('#updateDiv').off('input').on('input', 'input[name="number"], input[name="inportprice"]', function() {
								    var num = parseFloat($('#updateDiv input[name="number"]').val()) || 0;
								    var pri = parseFloat($('#updateDiv input[name="inportprice"]').val()) || 0;
								    $('#updateDiv input[name="sum"]').val((num * pri).toFixed(2));
								});
								
			                    url = "/inport/updateInport";
			                }
			            });
			        }
					
					// 自定义重置更新表单（不重置供应商和产品名称）
					$("#resetUpdateForm").click(function() {
					    // 1. 获取当前表单值 
					    var formData = form.val("updateFrm"); 
					    
					    // 2. 保存关键字段 
					    var providerid = formData.providerid; 
					    var providerName = $("#providerName").val();
					    var goodsid = formData.goodsid; 
					    var goodsName = $("#goodsName").val();
					    var id = formData.id; 
					    
					    // 3. 重置表单 
					    $("#updateFrm")[0].reset();
					    
					    // 4. 恢复关键字段 
					    form.val("updateFrm",  {
					        providerid: providerid,
					        goodsid: goodsid,
					        id: id,
					        number: '',
					        inportprice: '',
					        carton: '',
					        remark: ''
					    });
					    
					    // 5. 恢复显示名称 
					    $("#providerName").val(providerName);
					    $("#goodsName").val(goodsName);
								
								
						// 4. 重新计算总价（基于当前表单值）
						 var number = parseFloat($('input[name="number"]').val()) || 0;
						 var price = parseFloat($('input[name="inportprice"]').val()) || 0;
						$('input[name="sum"]').val((number * price).toFixed(2));
								    
						// 5. 重新渲染表单（确保Layui样式正确）
						form.render(); 
								    
						// 6. 调试用日志（正式环境可移除）
						console.log(" 表单已重置，保留关键字段并重新计算总价");
					   });
					    
			 
			        // 12. 删除入库记录 
			        function deleteInport(data) {
			            layer.confirm(' 确定要删除这条入库信息吗？', {icon: 3, title: '提示'}, function (index) {
			                $.post("/inport/deleteInport", {id: data.id},  function(res) {
			                    if (res.code  == 200) {
			                        tableIns.reload(); 
			                    }
			                    layer.msg(res.msg); 
			                    layer.close(index); 
			                });
			            });
			        }
			 
			        // 13. 执行入库 
			        function runInport(data) {
			            mainIndex = layer.open({ 
			                type: 1,
			                content: $("#runDiv"),
			                area: ['600px', '400px'],
			                title: '商品入库',
			                success: function () {
			                    $("#run")[0].reset();
			                    form.val("run",  {
			                        id: data.id, 
			                        runNumber: data.number  
			                    });
			                }
			            });
			        }
			 
					// 14. 提交新增表单 
					form.on("submit(doAddSubmit)",  function(data) {
					    $.post(url, data.field,  function(res) {
					        layer.msg(res.msg);  
					        if (res.code  == 200) {
					            tableIns.reload();  
					            layer.close(mainIndex);  
					        }
					    });
					    return false;
					});

					// 15. 提交修改表单 
					form.on("submit(doUpdateSubmit)",  function(data) {
					    $.post(url, data.field,  function(res) {
					        layer.msg(res.msg);  
					        if (res.code  == 200) {
					            tableIns.reload();  
					            layer.close(mainIndex);  
					        }
					    });
					    return false;
					});
			 
			        // 16. 执行入库提交 
			        form.on("submit(runSubmit)",  function(data) {
			            $.post("/inport/run", data.field,  function(res) {
			                layer.msg(res.msg); 
			                if (res.code  == 200) {
			                    tableIns.reload(); 
			                    layer.close(mainIndex); 
			                }
			            });
			            return false;
			        });
			 
			        // 17. 文件上传相关逻辑保持不变 
			        var selectedFile = null;
			         
			        $('#select-file').click(function(){
			            $('#file-input').click();
			        });
			         
			        $('#file-input').change(function(e){
			            if(this.files  && this.files.length  > 0){
			                selectedFile = this.files[0];  
			                
			                var fileExt = selectedFile.name.split('.').pop().toLowerCase();  
			                if(!['xlsx','xls'].includes(fileExt)){
			                    layer.msg(' 请选择Excel文件(xlsx或xls格式)', {icon: 2});
			                    return;
			                }
			                
			                if(selectedFile.size  > 100 * 1024 * 1024){
			                    layer.msg(' 文件大小不能超过100MB', {icon: 2});
			                    return;
			                }
			                
			                $('#file-name').text(selectedFile.name).css('color','#333');  
			            }
			        });
			         
			        $('#import-btn').click(function(){
			            if(!selectedFile){
			                layer.msg(' 请先选择Excel文件', {icon: 2});
			                return;
			            }
			            
			            var loadIndex = layer.load(2);  
			            $('#progress-container').show();
			            element.progress('import-progress',  '0%');
			            
			            var formData = new FormData();
			            formData.append('file',  selectedFile);
			            
			            var xhr = new XMLHttpRequest();
			            xhr.open('POST',  '/excel/importinport', true);
			            
			            xhr.upload.onprogress  = function(e) {
			                if(e.lengthComputable){  
			                    var percent = Math.round((e.loaded  / e.total)  * 100);
			                    element.progress('import-progress',  percent + '%');
			                }
			            };
			            
			            xhr.onload  = function() {
			                layer.close(loadIndex);  
			                if(xhr.status  === 200){
			                    try {
			                        var res = JSON.parse(xhr.responseText);  
			                        if(res.code  === 200){
			                            showImportResult(res);
			                            tableIns.reload();  
			                        } else {
			                            showErrorResult(res.msg  || '导入失败');
			                        }
			                    } catch(e) {
			                        showErrorResult('解析服务器响应失败');
			                    }
			                } else {
			                    showErrorResult('服务器错误: ' + xhr.status);  
			                }
			            };
			            
			            xhr.onerror  = function() {
			                layer.close(loadIndex);  
			                showErrorResult('网络错误，请检查连接');
			            };
			            
			            xhr.send(formData);  
			        });
			         
			        function showImportResult(res) {
			            var html = '<div style="color:green">导入成功！</div>' +
			                       '<div>总记录数: ' + res.data.total  + '</div>' +
			                       '<div>成功: ' + res.data.successCount  + '</div>' +
			                       '<div>失败: ' + res.data.failureCount  + '</div>';
			            
			            if(res.data.failureCount  > 0) {
			                html += '<div style="margin-top:10px;">' +
			                        '<a href="javascript:void(0)" class="layui-btn layui-btn-xs" id="show-error">查看失败详情</a>' +
			                        '<div id="error-detail" style="display:none;margin-top:10px;padding:10px;background:#f2f2f2;">';
			                
			                res.data.errorMessages.forEach(function(error,  index) {
			                    html += '<p>' + (index + 1) + '. 行号: ' + error.row  + ', 错误: ' + error.message  + '</p>';
			                });
			                
			                html += '</div></div>';
			                
			                $('#import-result').html(html);
			                
			                $('#show-error').click(function(){
			                    $('#error-detail').toggle();
			                });
			            } else {
			                $('#import-result').html(html);
			            }
			        }
			         
			        function showErrorResult(message) {
			            element.progress('import-progress',  '0%');
			            $('#import-result').html('<div style="color:red">' + message + '</div>');
			        }
			         
			        $('#download-template').click(function(){
			            window.location.href  = '/excel/inporttemplate';
			        });
			    });
			</script>
			</body>
			</html>
