<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>ERP仓库管理系统 by MYK</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta http-equiv="Access-Control-Allow-Origin" content="*">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    
    <link rel="stylesheet" href="../resources/layui/css/layui.css" media="all"/>
    <link rel="stylesheet" href="../resources/css/index.css" media="all"/>
</head>
<body class="main_body">
<div class="layui-layout  layui-layout-admin">
    <!-- 顶部 -->
    <div class="layui-header header">
        <div class="layui-main mag0">
            <a href="#" class="logo">ERP</a>
            <!-- 显示/隐藏菜单 -->
            <a href="javascript:" class="seraph hideMenu icon-caidan"></a>
            <!-- 顶部右侧菜单 -->
            <ul class="layui-nav top_menu">
                <li class="layui-nav-item" pc>
                    <a href="javascript:" class="clearCache"><i class="layui-icon"
                                                                data-icon="&#xe640;">&#xe640;</i><cite>ClearCache</cite><span
                            class="layui-badge-dot"></span></a>
                </li>
                <li class="layui-nav-item lockcms" pc>
                    <a href="javascript:"><i class="seraph icon-lock"></i><cite>Lock screen</cite></a>
                </li>
                <li class="layui-nav-item" id="userInfo">
                    <a href="javascript:"><cite class="adminName" th:text="${session.username}">管理员</cite></a>
                    <dl class="layui-nav-child">
                        <dd><a href="/sys/toChangePassword"><i
                                class="seraph icon-xiugai" data-icon="icon-xiugai"></i><cite>changePwd</cite></a></dd>
                        <dd><a href="/sys/toLogin" class="signOut"><i
                                class="seraph icon-tuichu"></i><cite>login out</cite></a></dd>
                    </dl>
                </li>
            </ul>
        </div>
    </div>
    <!-- 左侧导航 -->
    <div class="layui-side layui-bg-black">
        <!-- 搜索 --><p> Hello！<span class="userName" th:text="${session.username}"></span>, Welcome!</p>
        <div class="layui-form component">
            <select name="search" id="search" lay-search lay-filter="searchPage">
                <option value="">Search function</option>
                <option value="1">layer</option>
                <option value="2">form</option>
            </select>
            <i class="layui-icon">&#xe615;</i>
        </div>
        <div class="navBar layui-side-scroll" id="navBar">
            <ul class="layui-nav layui-nav-tree">
                <li class="layui-nav-item layui-this">
                    <a href="javascript:" data-url="/sys/toDeskManager"><i class="layui-icon" data-icon=""></i><cite>Backend Homepage</cite></a>
                </li>
            </ul>
        </div>
    </div>
    <!-- 右侧内容 -->
    <div class="layui-body layui-form">
        <div class="layui-tab mag0" lay-filter="bodyTab" id="top_tabs_box">
            <ul class="layui-tab-title top_tab" id="top_tabs">
                <li class="layui-this" lay-id=""><i class="layui-icon">&#xe68e;</i> <cite>Backend Homepage</cite></li>
            </ul>
            <ul class="layui-nav closeBox">
                <li class="layui-nav-item">
                    <a href="javascript:"><i class="layui-icon caozuo">&#xe643;</i> Page actions</a>
                    <dl class="layui-nav-child">
                        <dd><a href="javascript:" class="refresh refreshThis"><i class="layui-icon">&#x1002;</i>
                            Refresh</a></dd>
                        <dd><a href="javascript:" class="closePageOther"><i class="seraph icon-prohibit"></i> CloseOther</a>
                        </dd>
                        <dd><a href="javascript:" class="closePageAll"><i class="seraph icon-guanbi"></i> CloseAll</a></dd>
                    </dl>
                </li>
            </ul>
            <div class="layui-tab-content clildFrame">
                <div class="layui-tab-item layui-show">
                    <iframe src="/sys/toDeskManager"></iframe>
                </div>
            </div>
        </div>
    </div>
    <!-- 底部 -->
    <div class="layui-footer footer">
        <p><span>copyright @2025 MYK</span></p>
    </div>
</div>

<!-- 移动导航 -->
<div class="site-tree-mobile"><i class="layui-icon">&#xe602;</i></div>
<div class="site-mobile-shade"></div>

<script type="text/javascript" src="../resources/layui/layui.js"></script>
<script type="text/javascript" src="../resources/js/index.js"></script>
<script type="text/javascript" src="../resources/js/cache.js"></script>
</body>
</html>
