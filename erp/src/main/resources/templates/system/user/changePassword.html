<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"> 
<head>
    <meta charset="utf-8">
    <title>修改密码</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <link rel="stylesheet" href="../resources/layui/css/layui.css"  media="all" />
    <link rel="stylesheet" href="../resources/css/public.css"  media="all" />
	<style>
			label.layui-form-label {
			    width: 220px !important;  /* 默认宽度为120px，调整为180px或更大 */
			    white-space: nowrap;      /* 禁止换行 */
			    overflow: visible;        /* 允许内容溢出（避免被隐藏） */
			}
	    </style>
</head>
<body class="childrenBody">
    <form class="layui-form layui-row changePwd" method="post" id="formChange" lay-filter="formChange">
        <div class="layui-col-xs12 layui-col-sm6 layui-col-md6">
            <div class="layui-input-block layui-red pwdTips">The new password must be entered twice consistently in order to submit.新密码必须两次输入一致才能提交</div>
			
			<div class="layui-form-item">
				<div class="layui-inline">
				    <label class="layui-form-label">username(用户名)</label>
				    <div class="layui-input-inline" style="width: 400px;">
				        <input type="text" value="" id="name" th:value="${session.username}"  disabled class="layui-input layui-disabled" autocomplete="false">
				    </div>
				</div>
			</div>
			
			<div class="layui-form-item">
				<div class="layui-inline">
				    <label class="layui-form-label">newPwd(新密码)</label>
				    <div class="layui-input-inline" style="width: 400px;">
				         <input type="password" value="" id="newPwdOne" placeholder="Please input the newPwd！" lay-verify="required|newPwd" class="layui-input pwd" autocomplete="false">
				    </div>
				</div>
			</div>
			
			<div class="layui-form-item">
				<div class="layui-inline">
				    <label class="layui-form-label">confirmPwd(确认密码)</label>
				    <div class="layui-input-inline" style="width: 400px;">
				        <input type="password" value="" id="newPwdTwo" placeholder="Please input the newPwd twice！" lay-verify="required|confirmPwd" class="layui-input pwd" autocomplete="false">
				    </div>
				</div>
			</div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button class="layui-btn" lay-submit="" lay-filter="changePwd">Submit(提交)</button>
                    <button type="reset" class="layui-btn layui-btn-primary">Reset(重置)</button>
                </div>
            </div>
        </div>
    </form>
    <script type="text/javascript" src="../resources/layui/layui.js"></script> 
    <script type="text/javascript">
        layui.use(['jquery','form','layer'],function  () {
            var $ = layui.jquery; 
            var form = layui.form; 
            var layer = layui.layer; 
            
            // Form verification 
            form.verify({ 
                newPwd: function(value, item) {
                    if(value.length  < 6) {
                        return "The password length must be no less than 6 characters.密码长度不能小于6位";
                    }
                },
                confirmPwd: function(value, item) {
                    if($("#newPwdOne").val() !== value) {
                        return "The passwords entered twice do not match, please re-enter!两次输入密码不一致，请重新输入！";
                    }
                }
            });
            
            form.on("submit(changePwd)",function  () {
                var name = $("#name").val();
                var newPwdOne = $("#newPwdOne").val();
                var newPwdTwo = $("#newPwdTwo").val();
                
				layer.confirm('Confirm change the Password of  [' +name + ']?(你确定要修改【' + name + '】的密码吗？)', {
				                icon: 3, 
				                title: 'Alert(提示)'
				            }, function(index) {
				                var loadIndex = layer.load(2);  // 添加加载状态 
				                
				                $.post('/user/changePwd', {
				                    newPwdOne: newPwdOne,
				                    newPwdTwo: newPwdTwo 
				                }).done(function(res) {
									if(res.code  === 200) { // 假设返回200表示成功 
									    layer.msg(res.msg,  {
									        icon: 1,
									        time: 1000 // 2秒后自动关闭 
									    }, function(){
									        // 跳转到登录页 
									        window.location.href  = '/sys/toLogin';  // 修改为您的登录页路径 
									    });
									 } else {
										layer.msg(res.msg,  {icon: 2});
										$("#formChange")[0].reset(); // 重置表单 
									 }
				                }).fail(function(err) {
				                    layer.msg(' requesr fail,Pls retry(请求失败，请重试！)', {icon: 2});
				                }).always(function() {
				                    layer.close(loadIndex); 
				                    layer.close(index);  
				                });
				            });
				            return false;
				        });
				    });
    </script>
</body>
</html>
